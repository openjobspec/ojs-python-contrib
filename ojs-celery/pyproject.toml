[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openjobspec-celery"
version = "0.5.0"
description = "Celery compatibility layer for Open Job Spec (OJS)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "OpenJobSpec Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "openjobspec>=0.5.0,<0.6.0",
    "celery>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10,<2.0",
    "pip-audit>=2.7",
]

[project.urls]
Repository = "https://github.com/openjobspec/ojs-python-contrib"
Changelog = "https://github.com/openjobspec/ojs-python-contrib/blob/main/CHANGELOG.md"
Issues = "https://github.com/openjobspec/ojs-python-contrib/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ojs_celery"]

[tool.uv.sources]
openjobspec = { path = "../../ojs-python-sdk", editable = false }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "A", "C4", "DTZ", "T20", "PT", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

# Celery and Kombu do not ship type stubs or a py.typed marker; acknowledge the
# missing imports for those third-party packages without weakening our own types.
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true
