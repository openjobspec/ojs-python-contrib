version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/ojs-django"
      - "/ojs-flask"
      - "/ojs-fastapi"
      - "/ojs-celery"
      - "/ojs-sqlalchemy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci):"
