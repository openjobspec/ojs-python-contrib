[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openjobspec-fastapi"
version = "0.5.0"
description = "FastAPI integration for Open Job Spec (OJS)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "OpenJobSpec Contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "openjobspec>=0.5.0,<0.6.0",
    "fastapi>=0.110",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
    "ruff>=0.4",
    "mypy>=1.10,<2.0",
    "pip-audit>=2.7",
]

[project.urls]
Repository = "https://github.com/openjobspec/ojs-python-contrib"
Changelog = "https://github.com/openjobspec/ojs-python-contrib/blob/main/CHANGELOG.md"
Issues = "https://github.com/openjobspec/ojs-python-contrib/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ojs_fastapi"]

[tool.uv.sources]
openjobspec = { path = "../../ojs-python-sdk", editable = false }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "A", "C4", "DTZ", "T20", "PT", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are designed to be used as argument
# defaults; treat them as immutable so B008 does not flag the idiom.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.11"
strict = true
